name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/DavITFutures.Web/DavITFutures.Web.csproj -c Release -o release

      - name: Prepare for GitHub Pages
        working-directory: release/wwwroot
        run: |
          # Bez własnej domeny strona działa pod /<nazwa-repo>/, więc base href musi to uwzględnić.
          if [ ! -f CNAME ]; then
            sed -i "s#<base href=\"/\" />#<base href=\"/${GITHUB_REPOSITORY#*/}/\" />#" index.html
          fi
          # GitHub Pages zwraca 404.html dla nieznanych ścieżek; Blazor obsłuży je po starcie.
          cp index.html 404.html
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
